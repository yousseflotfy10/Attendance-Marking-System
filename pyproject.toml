[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "attendance-marking-system"
version = "0.1.0"
description = "Real-time attendance system using YOLO face detection and MobileNetV2 transfer learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
	"openpyxl>=3.1.0",
]

[project.scripts]
attendance-system = "attendance_system.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
